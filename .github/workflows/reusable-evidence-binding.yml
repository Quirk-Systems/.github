name: Reusable Evidence Binding

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Reject non-pull-request callers
        if: github.event_name != 'pull_request'
        run: exit 1

      - name: Checkout exact caller head with history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable policy source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quirk-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate caller evidence bindings
        env:
          RECEIPT_REPOSITORY: ${{ github.repository }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python .quirk-policy/scripts/validate_evidence_receipts.py
          --repository "$RECEIPT_REPOSITORY"
          --root .
          --receipts .quirk/evidence
          --range-base "$RANGE_BASE"
          --range-head "$RANGE_HEAD"
          --require-covered-diff
