name: Dependency Review

# Dispatch-only until an owner enables the repository's Dependency graph
# (Settings -> Code security). The action fails at startup without it
# (hosted run 35511456263). Re-enable `pull_request:` in a receipted change
# once the setting is read back; the reusable workflow is unaffected.
on:
  workflow_dispatch:

# Reads the dependency graph diff only; no comment is posted, so no PR write scope.
permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never
