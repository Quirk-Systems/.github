name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

# Read-only by default; the analysis job adds only what Scorecard needs.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token write signs published results; security-events write uploads SARIF.
    permissions:
      contents: read # checks out the source
      actions: read # lets the analysis read this workflow run's metadata
      id-token: write # requests the OIDC token used for signing
      security-events: write # uploads SARIF to code scanning
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@c23de5a82f64bb08c6d9f28844551440ca298e76 # v4.38.1
        with:
          sarif_file: results.sarif
