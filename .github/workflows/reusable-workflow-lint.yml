name: Reusable Workflow Lint

on:
  workflow_call:
    inputs:
      persona:
        description: "zizmor persona: regular | pedantic | auditor"
        required: false
        type: string
        default: pedantic

# Lint only reads workflow definitions.
permissions:
  contents: read

concurrency:
  group: reusable-workflow-lint-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: ${{ inputs.persona }}
          advanced-security: false
