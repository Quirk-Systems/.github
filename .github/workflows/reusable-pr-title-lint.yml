name: Reusable PR title lint

on:
  workflow_call:

# A called workflow's workflow-level permissions are a contract with its
# callers, not a local default: GitHub validates this block against the caller
# job's `permissions:` grant before it creates any job. A scope named here that
# no job below uses forces every caller to grant it too, and a caller that does
# not sees its run end in `startup_failure` with no job and no log to read. The
# job below checks out nothing; it reads the pull-request title.
permissions:
  pull-requests: read # the action reads the pull-request title; it posts nothing

concurrency:
  group: reusable-pr-title-lint-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate PR title against Conventional Commits
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
