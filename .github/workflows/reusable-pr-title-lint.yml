name: Reusable PR title lint

on:
  workflow_call:

# Default to read-only; the one job below grants the single scope it needs.
permissions:
  contents: read

concurrency:
  group: reusable-pr-title-lint-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # the action reads the pull-request title; it posts nothing
    steps:
      - name: Validate PR title against Conventional Commits
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
