name: Reusable Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "Minimum advisory severity that fails the check: low | moderate | high | critical"
        required: false
        type: string
        default: high
      deny-licenses:
        description: "Comma-separated SPDX identifiers that fail the check"
        required: false
        type: string
        default: "AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0"

# Reads the dependency graph diff only; no comment is posted, so no PR write scope.
permissions:
  contents: read

concurrency:
  group: reusable-dependency-review-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject non-pull-request callers
        if: github.event_name != 'pull_request'
        run: exit 1

      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
          comment-summary-in-pr: never
