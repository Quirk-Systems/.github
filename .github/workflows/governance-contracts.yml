name: Governance Contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact event revision with history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run governance unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate canonical topology
        run: >-
          python scripts/validate_topology.py
          --inventory .quirk/repositories.json
          --pull-requests .quirk/manual-prs.json

      - name: Validate evidence receipts on main
        if: github.event_name != 'pull_request'
        run: >-
          python scripts/validate_evidence_receipts.py
          --repository Quirk-Systems/.github
          --root .
          --receipts .quirk/evidence

      - name: Validate exact pull-request evidence coverage
        if: github.event_name == 'pull_request'
        env:
          RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/validate_evidence_receipts.py
          --repository Quirk-Systems/.github
          --root .
          --receipts .quirk/evidence
          --range-base "$RANGE_BASE"
          --range-head "$RANGE_HEAD"
          --require-covered-diff
