name: Reusable SBOM and Provenance

on:
  workflow_call:
    inputs:
      subject-path:
        description: "Path or glob of the built artifact(s) to attest, e.g. dist/*.tgz"
        required: true
        type: string
      sbom-path:
        description: "Directory or file the SBOM describes"
        required: false
        type: string
        default: "."
      sbom-format:
        description: "SBOM output format: spdx-json | cyclonedx-json"
        required: false
        type: string
        default: spdx-json

# Read-only by default; the attest job adds the two scopes Sigstore/GitHub attestations need.
permissions:
  contents: read

concurrency:
  group: reusable-sbom-provenance-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  attest:
    name: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token write requests the OIDC token that signs the attestation;
    # attestations write stores it against the repository.
    permissions:
      contents: read # checks out the source
      id-token: write # requests the OIDC token used for signing
      attestations: write # stores the signed provenance
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: ${{ inputs.sbom-path }}
          format: ${{ inputs.sbom-format }}
          output-file: sbom.json
          upload-artifact: true
          artifact-name: sbom.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.subject-path }}
