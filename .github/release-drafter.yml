name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
no-changes-template: '- No user-facing changes in this release window.'
version-resolver:
  major:
    labels:
      - major
      - breaking-change
  minor:
    labels:
      - enhancement
      - feature
  patch:
    labels:
      - bug
      - dependencies
      - documentation
      - governance
      - workflows
  default: patch
categories:
  - title: 'Governance and canon'
    labels:
      - governance
      - evidence
      - semantic
  - title: 'Automation and workflows'
    labels:
      - workflows
      - github-actions
      - ci
  - title: 'Copilot, prompts, and agents'
    labels:
      - copilot
      - prompts
      - agents
  - title: 'Documentation'
    labels:
      - documentation
exclude-labels:
  - skip-changelog
template: |
  ## Summary

  $CHANGES
